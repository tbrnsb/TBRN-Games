<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="TBRN-Games — Phone Controller">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#07050F">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <title>TBRN-Games Controller</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    @font-face {
      font-family: "Space Grotesk";
      src: url("/assets/fonts/space-grotesk-latin-500-normal.woff2") format("woff2");
      font-weight: 500; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: "Space Grotesk";
      src: url("/assets/fonts/space-grotesk-latin-700-normal.woff2") format("woff2");
      font-weight: 700; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: "Inter";
      src: url("/assets/fonts/inter-latin-400-normal.woff2") format("woff2");
      font-weight: 400; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: "Inter";
      src: url("/assets/fonts/inter-latin-600-normal.woff2") format("woff2");
      font-weight: 600; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: "Orbitron";
      src: url("/assets/fonts/orbitron-latin-700-normal.woff2") format("woff2");
      font-weight: 700; font-style: normal; font-display: swap;
    }
    :root {
      --ink: #07050F;
      --bg: #0B0820;
      --surface: #1B1545;
      --surface-hi: #251C5A;
      --border: rgba(255,255,255,0.09);
      --text: #F5F3FF;
      --muted: #A29BCF;
      --magenta: #FF2E97;
      --cyan: #00E5FF;
      --amber: #FFB347;
      --success: #3DFFA2;
      --danger: #FF4D6D;
      --display: "Space Grotesk", sans-serif;
      --body: "Inter", sans-serif;
      --title: "Orbitron", sans-serif;
    }
    html, body { height: 100%; }
    body {
      font-family: var(--body);
      background: var(--ink);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      overflow: hidden;
      position: relative;
      padding:
        env(safe-area-inset-top, 0)
        env(safe-area-inset-right, 0)
        env(safe-area-inset-bottom, 0)
        env(safe-area-inset-left, 0);
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(120% 90% at 25% 15%, rgba(255,46,151,0.20), transparent 68%);
      pointer-events: none;
      z-index: 0;
    }
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: linear-gradient(to bottom, transparent, black 70%);
      pointer-events: none;
      z-index: 0;
    }
    .appbar {
      flex: 0 0 auto;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 1px solid var(--border);
      position: relative;
      z-index: 1;
    }
    .brand {
      font-family: var(--title);
      font-size: 11px;
      letter-spacing: 0.18em;
      display: flex;
      gap: 6px;
      align-items: baseline;
    }
    .brand b { color: var(--magenta); font-weight: 700; }
    .who {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      color: var(--muted);
      max-width: 55vw;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .seat-badge {
      width: 20px; height: 20px;
      border-radius: 5px;
      display: inline-grid;
      place-items: center;
      font-family: var(--display);
      font-weight: 700;
      font-size: 12px;
      color: var(--ink);
      flex: 0 0 auto;
    }
    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--muted);
      flex: 0 0 auto;
    }
    .dot.on {
      background: var(--success);
      box-shadow: 0 0 10px var(--success);
    }
    .dot.off {
      background: var(--danger);
      box-shadow: 0 0 10px var(--danger);
    }
    main {
      flex: 1;
      min-height: 0;
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    /* ---- Join ---- */
    .join {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 14px;
      width: 100%;
      max-width: 380px;
      margin: 0 auto;
      padding: 20px 20px 28px;
      border-left: 3px solid var(--magenta);
    }
    .kick {
      font-size: 12px;
      color: var(--muted);
    }
    .code-field { display: flex; flex-direction: column; gap: 6px; }
    .code-field label,
    .name-field span {
      font-size: 11px;
      color: var(--muted);
    }
    .code-input,
    .name-field input {
      width: 100%;
      height: 58px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-family: var(--body);
      font-size: 16px;
      padding: 0 14px;
      outline: none;
    }
    .code-input {
      font-family: var(--title);
      font-size: 28px;
      letter-spacing: 0.28em;
      text-align: center;
      text-transform: uppercase;
      padding-left: calc(14px + 0.28em);
    }
    .code-input::placeholder {
      color: rgba(162,155,207,0.35);
      letter-spacing: 0.18em;
    }
    .code-input:focus,
    .name-field input:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px rgba(0,229,255,0.12);
    }
    .name-field { display: flex; flex-direction: column; gap: 6px; }
    .linked {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 44px;
      padding: 0 12px;
      border-radius: 10px;
      background: rgba(61,255,162,0.08);
      border: 1px solid rgba(61,255,162,0.28);
      color: var(--success);
      font-size: 13px;
    }
    .primary {
      height: 56px;
      width: 100%;
      border: 0;
      border-radius: 10px;
      background: var(--magenta);
      color: var(--ink);
      font-family: var(--display);
      font-weight: 700;
      font-size: 17px;
      cursor: pointer;
      transition: transform 100ms ease, background 120ms ease;
    }
    .primary:active { transform: scale(0.985); background: #FF54A8; }
    .primary:disabled { background: rgba(255,255,255,0.08); color: rgba(245,243,255,0.35); }
    .hint {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.45;
    }
    .hint.error { color: var(--danger); }
    /* ---- Play ---- */
    .play {
      flex: 1;
      width: 100%;
      max-width: 460px;
      margin: 0 auto;
      padding: 12px 14px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 0;
      overflow: hidden;
    }
    .coach {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 9px;
      min-height: 44px;
      padding: 9px 12px;
      border-radius: 10px;
      background: rgba(27,21,69,0.72);
      border: 1px solid var(--border);
      font-size: 13px;
      color: var(--muted);
      line-height: 1.35;
    }
    .coach .dot { background: var(--muted); }
    .coach.your-turn {
      border-color: rgba(255,46,151,0.55);
      color: var(--text);
      background: rgba(255,46,151,0.10);
    }
    .coach.your-turn .dot {
      background: var(--magenta);
      box-shadow: 0 0 10px var(--magenta);
      animation: breathe 1.6s ease-in-out infinite;
    }
    /* ---- Host controls (first phone) ---- */
    .host-controls {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255,179,71,0.28);
      background: rgba(255,179,71,0.06);
    }
    .host-row { display: flex; gap: 8px; }
    .host-btn {
      flex: 1;
      min-height: 44px;
      padding: 0 10px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.05);
      color: var(--text);
      font-family: var(--display);
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }
    .host-btn:active { background: rgba(255,255,255,0.1); }
    .host-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .host-btn.danger {
      border-color: rgba(255,77,109,0.45);
      background: rgba(255,77,109,0.08);
      color: var(--danger);
    }
    .host-btn.danger.confirm { background: var(--danger); color: var(--ink); }
    .host-hint {
      font-size: 11px;
      line-height: 1.4;
      color: var(--muted);
      min-height: 14px;
    }
    .host-hint.error { color: var(--danger); }
    .game-label {
      flex: 0 0 auto;
      font-family: var(--display);
      font-weight: 700;
      font-size: 20px;
      letter-spacing: -0.01em;
      min-height: 1px;
    }
    .idle {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 9px;
      text-align: center;
      padding: 18px;
      min-height: 0;
    }
    .idle-mark {
      width: 82px;
      height: 82px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.12);
      display: grid;
      place-items: center;
      position: relative;
      margin-bottom: 8px;
    }
    .idle-mark::before {
      content: "";
      position: absolute;
      inset: -9px;
      border-radius: 50%;
      border: 1px solid rgba(255,46,151,0.30);
      animation: breathe 2.8s ease-in-out infinite;
    }
    .idle-mark span {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--magenta);
      box-shadow: 0 0 18px var(--magenta);
    }
    .idle-title {
      font-family: var(--display);
      font-weight: 700;
      font-size: 20px;
    }
    .idle-copy {
      font-size: 13px;
      color: var(--muted);
      max-width: 260px;
      line-height: 1.45;
    }
    .table-note {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-align: center;
      padding: 18px;
      min-height: 0;
    }
    .reaction-bar {
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px;
      width: 100%;
    }
    .reaction-btn {
      min-height: 48px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.04);
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
    }
    .reaction-btn:active { background: rgba(255,46,151,0.16); }
    .reaction-btn:disabled { opacity: 0.35; cursor: default; }
    .reaction-hint {
      flex: 0 0 auto;
      min-height: 14px;
      text-align: center;
      font-size: 11px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .leave-btn {
      flex: 0 0 auto;
      align-self: center;
      min-height: 40px;
      padding: 0 18px;
      border-radius: 999px;
      border: 1px solid rgba(255,77,109,0.35);
      background: transparent;
      color: var(--danger);
      font-family: var(--body);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .session-card {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 11px;
      padding: 14px;
      border-radius: 14px;
      background: linear-gradient(160deg, rgba(37,28,90,0.88), rgba(27,21,69,0.72));
      border: 1px solid var(--border);
      text-align: left;
    }
    .session-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
    }
    .session-kicker {
      font-family: var(--display);
      font-weight: 700;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--magenta);
    }
    .session-round {
      font-family: var(--display);
      font-weight: 700;
      font-size: 12px;
      color: var(--muted);
    }
    .session-points {
      display: flex;
      align-items: baseline;
      gap: 7px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .session-points strong {
      font-family: var(--display);
      font-size: 28px;
      line-height: 1;
      color: var(--amber);
    }
    .session-points span { font-size: 11px; color: var(--muted); }
    .session-copy {
      font-size: 12px;
      line-height: 1.45;
      color: var(--muted);
    }
    .vote-list { display: flex; flex-direction: column; gap: 6px; }
    .vote-btn {
      min-height: 48px;
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.04);
      color: var(--text);
      font: inherit;
      text-align: left;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .vote-btn:disabled { cursor: default; opacity: 0.72; }
    .vote-btn.leading { border-color: rgba(255,46,151,0.58); background: rgba(255,46,151,0.13); }
    .vote-btn.yours { border-color: rgba(0,229,255,0.65); background: rgba(0,229,255,0.10); }
    .vote-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
    .vote-name { font-family: var(--display); font-weight: 700; font-size: 14px; }
    .vote-count { font-family: var(--display); font-weight: 700; font-size: 12px; color: var(--muted); }
    .vote-btn.leading .vote-count { color: var(--magenta); }
    .vote-bar {
      height: 3px;
      border-radius: 2px;
      background: rgba(255,255,255,0.09);
      overflow: hidden;
    }
    .vote-bar i { display: block; height: 100%; background: var(--magenta); }
    .vote-btn.yours .vote-bar i { background: var(--cyan); }
    .session-champion {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 8px 0 14px;
      border-bottom: 1px solid var(--border);
      text-align: center;
    }
    .session-champion strong {
      font-family: var(--title);
      font-size: 30px;
      line-height: 1.1;
    }
    .session-champion .pts { font-family: var(--display); font-weight: 700; color: var(--amber); font-size: 13px; }
    .session-trophies { display: flex; flex-direction: column; gap: 6px; }
    .trophy-row {
      padding: 8px 10px;
      border-radius: 9px;
      background: rgba(255,255,255,0.04);
      border-left: 3px solid var(--magenta);
    }
    .trophy-row .t {
      display: block;
      font-family: var(--display);
      font-weight: 700;
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--magenta);
    }
    .trophy-row .p { font-family: var(--display); font-weight: 700; font-size: 15px; }
    .trophy-row .d { display: block; font-size: 11px; color: var(--muted); }
    #controllerContainer {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: safe center;
      gap: 14px;
      width: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 8px;
    }
    #controllerContainer:empty { display: none; }
    #controllerContainer[data-layout="text"],
    #controllerContainer[data-layout="choice"] {
      justify-content: flex-start;
      padding-top: 18px;
    }
    /* ---- One button ---- */
    .btn-one {
      width: min(64vw, 230px);
      aspect-ratio: 1;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.18);
      background:
        radial-gradient(circle at 35% 30%, #FF6FB6, transparent 55%),
        var(--magenta);
      color: var(--ink);
      font-family: var(--display);
      font-weight: 700;
      font-size: 26px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      box-shadow:
        0 0 0 8px rgba(255,46,151,0.10),
        0 18px 50px rgba(255,46,151,0.35);
      transition: transform 90ms ease, box-shadow 90ms ease;
      user-select: none;
    }
    .btn-one:active {
      transform: scale(0.94);
      box-shadow:
        0 0 0 12px rgba(255,46,151,0.16),
        0 10px 36px rgba(255,46,151,0.5);
    }
    .btn-one:disabled { opacity: 0.4; transform: none; box-shadow: none; }
    .btn-label { font-size: 24px; letter-spacing: 0.02em; }
    .btn-count {
      font-family: var(--display);
      font-size: 38px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    /* ---- Left / right ---- */
    .lr-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
    }
    .btn-lr {
      height: min(34vh, 190px);
      min-height: 110px;
      border-radius: 18px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-family: var(--display);
      font-weight: 700;
      font-size: 17px;
      letter-spacing: 0.02em;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
      transition: transform 80ms ease, background 120ms ease, border-color 120ms ease;
    }
    .btn-lr::before {
      font-size: 30px;
      line-height: 1;
    }
    .btn-lr.left::before { content: "◀"; color: var(--cyan); }
    .btn-lr.right::before { content: "▶"; color: var(--magenta); }
    .btn-lr:active { transform: scale(0.97); }
    .btn-lr.left:active { background: rgba(0,229,255,0.14); border-color: rgba(0,229,255,0.5); }
    .btn-lr.right:active { background: rgba(255,46,151,0.14); border-color: rgba(255,46,151,0.5); }
    /* ---- D-pad ---- */
    .dpad {
      display: grid;
      grid-template-areas: ". up ." "left . right" ". down .";
      gap: 10px;
      width: min(88vw, 340px);
    }
    .dpad-btn {
      aspect-ratio: 1;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-family: var(--display);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
      transition: background 100ms ease, border-color 100ms ease, transform 70ms ease;
    }
    .dpad-btn:active {
      background: rgba(255,46,151,0.16);
      border-color: rgba(255,46,151,0.55);
      transform: scale(0.96);
    }
    .dpad-btn .glyph { font-size: 24px; line-height: 1; }
    .dpad-btn .cap { font-size: 11px; color: var(--muted); font-family: var(--body); font-weight: 600; }
    .dpad-btn.up { grid-area: up; }
    .dpad-btn.down { grid-area: down; }
    .dpad-btn.left { grid-area: left; }
    .dpad-btn.right { grid-area: right; }
    /* ---- Text ---- */
    .text-input {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .text-input textarea {
      width: 100%;
      min-height: 132px;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-family: var(--body);
      font-size: 17px;
      line-height: 1.45;
      resize: none;
      outline: none;
    }
    .text-input textarea:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px rgba(0,229,255,0.12);
    }
    .text-input button { width: 100%; }
    .char-count {
      text-align: right;
      font-size: 11px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    /* ---- Choices ---- */
    .choices {
      display: flex;
      flex-direction: column;
      gap: 9px;
      width: 100%;
      /* Long ballots scroll inside the play area instead of pushing the
         coach/status off screen. */
      max-height: min(62vh, 560px);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      padding-right: 2px;
    }
    .choice-btn {
      /* 56px stays above the 48dp minimum even at 1.5x text. Never shrink it. */
      min-height: 56px;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-family: var(--body);
      font-size: 16px;
      font-weight: 600;
      line-height: 1.35;
      text-align: left;
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
      transition: background 100ms ease, border-color 100ms ease, transform 70ms ease;
    }
    .choice-btn:active { transform: scale(0.99); }
    .choice-btn.selected {
      background: rgba(255,46,151,0.14);
      border-color: var(--magenta);
      color: var(--text);
    }
    .choice-btn:disabled { opacity: 0.42; cursor: not-allowed; }
    .choices-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(46px, 1fr));
      gap: 6px;
    }
    .choices-grid .choice-btn {
      min-height: 48px;
      padding: 0;
      text-align: center;
      font-family: var(--display);
      font-weight: 700;
      font-size: 18px;
    }
    /* 7+ vote options: two columns with the same A/B/C badges as the TV. */
    .choices.two-column {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      align-content: start;
      gap: 8px;
    }
    .choices.two-column .choice-btn {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 10px 11px;
      min-height: 56px;
      overflow-wrap: anywhere;
    }
    .choice-letter {
      flex: 0 0 auto;
      display: inline-grid;
      place-items: center;
      min-width: 26px;
      height: 26px;
      padding: 0 4px;
      border-radius: 7px;
      background: rgba(255,46,151,0.15);
      border: 1px solid rgba(255,46,151,0.45);
      color: var(--magenta);
      font-family: var(--display);
      font-weight: 700;
      font-size: 12px;
      line-height: 1;
    }
    /* ---- Poker action bar ---- */
    .table-info {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      width: 100%;
    }
    .table-info span {
      padding: 5px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,0.05);
      font-size: 12px;
      color: var(--muted);
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      width: 100%;
    }
    .action-btn {
      flex: 1;
      min-height: 54px;
      padding: 0 6px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-family: var(--display);
      font-weight: 700;
      font-size: 14px;
      white-space: nowrap;
      cursor: pointer;
      touch-action: manipulation;
    }
    .action-btn.raise {
      background: var(--magenta);
      color: var(--ink);
      border-color: transparent;
    }
    .action-btn.fold {
      color: var(--danger);
      border-color: rgba(255,77,109,0.4);
    }
    .action-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .action-hint {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      padding-bottom: 4px;
    }
    /* ---- Grids ---- */
    .grid-frame {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 10px;
      border-radius: 14px;
      background: rgba(27,21,69,0.55);
      border: 1px solid var(--border);
    }
    .grid-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      color: var(--muted);
      padding: 0 2px;
    }
    .grid-wrap { width: 100%; overflow-x: auto; }
    .grid {
      display: grid;
      gap: 3px;
      width: 100%;
    }
    .grid-cell {
      aspect-ratio: 1;
      min-width: 0;
      border-radius: 4px;
      border: 1px solid rgba(255,255,255,0.07);
      background: rgba(255,255,255,0.025);
      color: var(--text);
      font-family: var(--display);
      font-weight: 700;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
      padding: 0;
    }
    .grid-cell:active { background: rgba(255,46,151,0.22); }
    .grid-cell.v-fill { background: rgba(255,255,255,0.07); }
    .grid-cell.v-X { background: rgba(255,77,109,0.20); color: var(--danger); border-color: rgba(255,77,109,0.45); }
    .grid-cell.v-o { color: var(--muted); }
    .grid-cell.v-S { background: rgba(61,255,162,0.13); color: var(--success); }
    .grid-cell.v-selected { border-color: var(--magenta); background: rgba(255,46,151,0.18); }
    .grid-cell.v-picked {
      border-color: var(--cyan);
      background: rgba(0,229,255,0.20);
      box-shadow: 0 0 0 1px rgba(0,229,255,0.45);
    }
    .grid-actions {
      position: sticky;
      bottom: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
      padding: 8px;
      border-radius: 12px;
      background: rgba(11,8,32,0.95);
      border: 1px solid var(--border);
      backdrop-filter: blur(6px);
    }
    .grid-actions .pick {
      flex: 1;
      font-family: var(--display);
      font-weight: 700;
      font-size: 16px;
      color: var(--muted);
    }
    .grid-actions .pick.ready { color: var(--text); }
    .grid-actions .primary {
      flex: 0 0 auto;
      width: auto;
      min-width: 120px;
      height: 46px;
      padding: 0 18px;
      font-size: 15px;
    }
    .grid-divider {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 10px;
      padding: 4px 0 2px;
    }
    .grid-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    /* ---- Cards ---- */
    .hand {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      width: 100%;
      padding: 8px 0;
    }
    .card {
      width: 84px;
      height: 118px;
      border-radius: 10px;
      background: #F5F3FF;
      color: #1B1545;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      font-family: var(--display);
      box-shadow: 0 10px 24px rgba(0,0,0,0.35);
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
      transition: transform 90ms ease;
    }
    .card:active { transform: translateY(-8px); }
    .card.red { color: #D6204E; }
    .card.face-down {
      background:
        repeating-linear-gradient(45deg, rgba(255,255,255,0.10) 0 6px, transparent 6px 12px),
        var(--magenta);
      color: rgba(245,243,255,0.85);
      font-size: 24px;
    }
    .rank { font-size: 26px; font-weight: 700; line-height: 1; }
    .suit { font-size: 30px; line-height: 1; }
    .hidden { display: none !important; }
    @keyframes breathe {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    @media (max-height: 560px) {
      .btn-one { width: min(44vw, 160px); }
      .btn-lr { height: 30vh; min-height: 90px; }
      .dpad { width: min(70vw, 260px); }
      .text-input textarea { min-height: 96px; }
      .join { gap: 10px; }
      .code-input, .name-field input { height: 50px; }
      .primary { height: 50px; }
      .play { gap: 8px; }
      .game-label { font-size: 17px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .coach.your-turn .dot { animation: none; }
      .idle-mark::before { animation: none; }
      .primary, .btn-one, .btn-lr, .choice-btn, .card, .dpad-btn { transition: none; }
    }
    /* --- motion + value layouts (slider, pad, aim, race, board, numpad, canvas, chat) --- */
    .slider-wrap { display: flex; flex-direction: column; gap: 8px; width: 100%; }
    .slider-wrap .slider-label { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    .slider-track {
      --v: .5;
      position: relative; flex: 1; min-height: 64px; border-radius: 999px;
      background: var(--surface, rgba(255,255,255,.08)); border: 1px solid var(--border, rgba(255,255,255,.14));
      touch-action: none; cursor: grab; overflow: hidden;
    }
    .slider-track:active { cursor: grabbing; }
    .slider-wrap.x .slider-track { min-height: 64px; }
    .slider-wrap.y { align-items: center; }
    .slider-wrap.y .slider-track {
      width: 72px; height: 100%; min-height: 180px; border-radius: 999px;
    }
    .slider-fill { position: absolute; inset: 0; background: var(--accent, #ffd166); opacity: .25; }
    .slider-wrap.x .slider-fill { width: calc(var(--v) * 100%); }
    .slider-wrap.y .slider-fill { top: auto; height: calc(var(--v) * 100%); }
    .slider-knob {
      --v: .5;
      position: absolute; width: 44px; height: 44px; border-radius: 50%;
      background: var(--accent, #ffd166); border: 3px solid #111;
      box-shadow: 0 4px 0 rgba(0,0,0,.35);
      left: calc(var(--v) * (100% - 44px)); top: 50%; transform: translateY(-50%);
      pointer-events: none;
    }
    .slider-wrap.y .slider-knob {
      left: 50%; top: auto; bottom: calc(var(--v) * (100% - 44px)); transform: translateX(-50%);
    }
    .slider-readout { font-size: 22px; font-weight: 800; text-align: center; font-variant-numeric: tabular-nums; }
    .slider-track.is-disabled { opacity: .5; }

    .dual-slider { display: flex; flex-direction: column; gap: 12px; padding: 8px; }
    .dual-hint { font-size: 13px; color: var(--muted); text-align: center; }
    .dual-action { width: 100%; padding: 18px; font-size: 18px; font-weight: 800; }

    .pad-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .pad-label { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    .pad {
      --kx: 0; --ky: 0;
      position: relative; width: min(78vw, 320px); aspect-ratio: 1; border-radius: 50%;
      background: var(--surface, rgba(255,255,255,.08)); border: 2px solid var(--border, rgba(255,255,255,.16));
      touch-action: none; cursor: grab;
    }
    .pad:active { cursor: grabbing; }
    .pad.is-disabled { opacity: .5; }
    .pad-cross::before, .pad-cross::after {
      content: ""; position: absolute; background: rgba(255,255,255,.10);
    }
    .pad-cross::before { left: 10%; right: 10%; top: 50%; height: 1px; }
    .pad-cross::after { top: 10%; bottom: 10%; left: 50%; width: 1px; }
    .pad-knob {
      --kx: 0; --ky: 0;
      position: absolute; left: 50%; top: 50%; width: 92px; height: 92px; border-radius: 50%;
      background: var(--accent, #ffd166); border: 3px solid #111;
      transform: translate(calc(-50% + var(--kx) * 34%), calc(-50% + var(--ky) * 34%));
      box-shadow: 0 6px 0 rgba(0,0,0,.35); pointer-events: none;
    }

    .aim { display: flex; flex-direction: column; gap: 14px; }
    .aim-hint { text-align: center; font-size: 13px; color: var(--muted); }
    .aim-row { display: flex; gap: 16px; align-items: center; justify-content: center; }
    .aim-pad { width: min(56vw, 240px); }
    .aim-power { width: 72px; height: min(56vw, 240px); }
    .aim-action { width: 100%; padding: 20px; font-size: 20px; font-weight: 800; }

    .race { display: flex; flex-direction: column; gap: 14px; align-items: stretch; }
    .race-meter { height: 14px; border-radius: 999px; background: rgba(255,255,255,.10); overflow: hidden; }
    .race-fill { height: 100%; background: var(--accent, #ffd166); transition: width .08s linear; }
    .race-btn {
      padding: 18vh 0; font-size: 40px; font-weight: 900; letter-spacing: .06em;
      border-radius: 24px; border: 4px solid #111; background: var(--accent, #ffd166); color: #111;
      box-shadow: 0 10px 0 rgba(0,0,0,.45); touch-action: manipulation;
    }
    .race-btn:active { transform: translateY(6px); box-shadow: 0 4px 0 rgba(0,0,0,.45); }
    .race-btn:disabled { opacity: .5; }
    .race-stats { display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; }
    .race-count { font-size: 28px; font-weight: 900; }
    .race-rival { font-size: 14px; color: var(--muted); }

    .board { display: flex; flex-direction: column; gap: 10px; }
    .board-title { font-size: 18px; font-weight: 800; }
    .board-subtitle { font-size: 14px; color: var(--muted); }
    .board-hint { font-size: 13px; color: var(--muted); }
    .board-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .board-tile {
      position: relative; padding: 6px 4px; border-radius: 12px; border: 2px solid var(--border, rgba(255,255,255,.16));
      background: var(--surface, rgba(255,255,255,.06)); color: var(--text, #fff);
      display: flex; flex-direction: column; align-items: center; gap: 4px;
    }
    .board-tile.marked { opacity: .35; filter: grayscale(1); }
    .board-tile.selected { outline: 3px solid var(--accent, #ffd166); }
    .board-img { width: 100%; border-radius: 8px; display: block; }
    .board-initial { font-size: 22px; font-weight: 900; }
    .board-name { font-size: 10px; line-height: 1.1; text-align: center; }
    .board-choices { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }

    .numpad { display: flex; flex-direction: column; gap: 10px; }
    .numpad-label { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    .numpad-display { display: flex; align-items: baseline; justify-content: space-between; }
    .numpad-value { font-size: 40px; font-weight: 900; font-variant-numeric: tabular-nums; }
    .numpad-range { font-size: 12px; color: var(--muted); }
    .numpad-presets { display: flex; gap: 8px; flex-wrap: wrap; }
    .numpad-preset {
      flex: 1; min-width: 64px; padding: 10px; border-radius: 10px; font-weight: 700;
      border: 1px solid var(--border, rgba(255,255,255,.16)); background: var(--surface, rgba(255,255,255,.06)); color: inherit;
    }
    .numpad-keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .numpad-key {
      padding: 18px 0; font-size: 22px; font-weight: 800; border-radius: 12px;
      border: 1px solid var(--border, rgba(255,255,255,.16)); background: var(--surface, rgba(255,255,255,.06)); color: inherit;
    }
    .numpad-key:active { background: var(--accent, #ffd166); color: #111; }
    .numpad-submit { padding: 16px; font-size: 17px; font-weight: 800; }

    .canvas-wrap { display: flex; flex-direction: column; gap: 10px; }
    .canvas-prompt { font-size: 15px; font-weight: 700; }
    .draw-surface {
      width: 100%; aspect-ratio: 1; border-radius: 16px; background: #fff;
      border: 3px solid #111; touch-action: none; cursor: crosshair;
    }
    .canvas-tools { display: flex; gap: 8px; }

    .chat { display: flex; flex-direction: column; gap: 8px; height: 100%; }
    .chat-contacts { display: flex; gap: 6px; overflow-x: auto; }
    .chat-contact {
      padding: 8px 12px; border-radius: 999px; white-space: nowrap; font-size: 13px; font-weight: 700;
      border: 1px solid var(--border, rgba(255,255,255,.16)); background: var(--surface, rgba(255,255,255,.06)); color: inherit;
    }
    .chat-contact.active { background: var(--accent, #ffd166); color: #111; }
    .chat-thread { flex: 1; min-height: 160px; max-height: 40vh; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
    .chat-msg { font-size: 14px; background: var(--surface, rgba(255,255,255,.06)); border-radius: 10px; padding: 8px 10px; }
    .chat-compose { display: flex; gap: 8px; }
    .chat-input { flex: 1; padding: 12px; border-radius: 12px; border: 1px solid var(--border, rgba(255,255,255,.16)); background: var(--surface, rgba(255,255,255,.06)); color: inherit; font-size: 15px; }
    .chat-remaining { font-size: 12px; color: var(--muted); text-align: right; }
    .role { display: flex; flex-direction: column; gap: 12px; }
    .role-card { display: none; padding: 18px; border-radius: 16px; border: 3px solid #111; background: var(--accent, #ffd166); color: #111; }
    .role-card.visible { display: block; }
    .role-title { font-size: 18px; font-weight: 900; margin-bottom: 6px; }
    .role-body { font-size: 16px; font-weight: 600; }
    .role-hold { padding: 22px; font-size: 18px; font-weight: 800; border-radius: 16px; border: 3px solid #111; background: var(--surface, rgba(255,255,255,.08)); color: inherit; }
    .role-hint { font-size: 12px; color: var(--muted); text-align: center; }
    .howto {
      margin: 8px 0 0; padding: 10px 12px; border-radius: 12px;
      font-size: 13px; line-height: 1.35; color: var(--muted, #aab4d4);
      background: var(--surface, rgba(255,255,255,.06));
      border: 1px solid var(--border, rgba(255,255,255,.12));
    }
    .howto.hidden { display: none; }
    .canvas-tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .canvas-colors { display: flex; gap: 6px; }
    .canvas-swatch {
      width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--border, rgba(255,255,255,.2));
      background: var(--swatch); padding: 0;
    }
    .canvas-swatch.active { outline: 3px solid var(--accent, #ffd166); outline-offset: 2px; }
    .canvas-sizes { display: flex; gap: 6px; margin-left: auto; }
    .canvas-size {
      width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center;
      border: 1px solid var(--border, rgba(255,255,255,.2)); background: var(--surface, rgba(255,255,255,.06));
    }
    .canvas-size span { display: block; width: var(--dot); height: var(--dot); border-radius: 50%; background: var(--text, #fff); }
    .canvas-size.active { outline: 2px solid var(--accent, #ffd166); outline-offset: 1px; }
    .raise-row { display: flex; align-items: center; gap: 8px; flex: 1 1 auto; min-width: 0; }
    .raise-step {
      width: 48px; height: 48px; flex: 0 0 48px; border-radius: 12px; font-size: 20px; font-weight: 800;
      border: 1px solid var(--border, rgba(255,255,255,.16)); background: var(--surface, rgba(255,255,255,.06)); color: inherit;
      touch-action: manipulation;
    }
    .raise-amount { min-width: 64px; text-align: center; font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
    /* 360dp phones: the raise stepper takes its own full row so fold / check /
       call stay at a 48dp tap target instead of shrinking. */
    @media (max-width: 400px) {
      .raise-row { flex: 1 1 100%; }
      .raise-amount { flex: 1; }
    }
  </style>
</head>
<body>
  <header class="appbar">
    <div class="brand"><span>TBRN</span><b>GAMES</b></div>
    <div class="who"><span class="dot" id="connDot"></span><span class="seat-badge hidden" id="seatBadge" aria-hidden="true"></span><span id="playerName">Not joined</span></div>
  </header>
  <main>
    <section class="join" id="joinForm">
      <p class="kick">Join the room</p>
      <div class="code-field" id="codeField">
        <label for="codeInput">Room code</label>
        <input class="code-input" id="codeInput" placeholder="ABC12" maxlength="5" autocomplete="off" autocapitalize="characters" spellcheck="false" inputmode="text">
      </div>
      <div class="linked hidden" id="roomLinked"><span class="dot on"></span>Room linked from the QR code</div>
      <label class="name-field">
        <span>Your name</span>
        <input id="nameInput" placeholder="Your name" maxlength="12" autocomplete="off" autocapitalize="words">
      </label>
      <button class="primary" id="joinBtn">Join room</button>
      <p class="hint" id="joinError" role="alert"></p>
      <p class="hint" id="joinHint">The code is on the laptop screen.</p>
    </section>

    <section class="play hidden" id="controllerArea">
      <div class="game-label" id="gameLabel"></div>
      <div class="coach" id="coach"><span class="dot"></span><span id="status">Waiting for the host…</span></div>
      <div class="howto hidden" id="howTo"></div>
      <div class="host-controls hidden" id="hostControls" aria-label="Host controls">
        <div class="host-row">
          <button class="host-btn" id="hostPauseBtn" type="button">Pause</button>
          <button class="host-btn" id="hostWaitBtn" type="button">Wait</button>
          <button class="host-btn" id="hostResumeBtn" type="button">Resume</button>
          <button class="host-btn danger" id="hostEndBtn" type="button">End game</button>
        </div>
        <p class="host-hint" id="hostHint"></p>
      </div>
      <div class="table-note hidden" id="tableNote" aria-live="polite">
        <p class="idle-title" id="tableNoteTitle"></p>
        <p class="idle-copy" id="tableNoteCopy"></p>
      </div>
      <section class="session-card hidden" id="sessionCard" aria-live="polite"></section>
      <div class="idle" id="idle">
        <div class="idle-mark"><span></span></div>
        <p class="idle-title">You're at the table</p>
        <p class="idle-copy">Keep this tab open. The host picks a game on the laptop.</p>
      </div>
      <div id="controllerContainer"></div>
      <div class="reaction-bar hidden" id="reactionBar" aria-label="Send a reaction"></div>
      <p class="reaction-hint hidden" id="reactionHint"></p>
      <button class="leave-btn hidden" id="leaveBtn" type="button">Leave table</button>
    </section>
  </main>
  <script type="module" src="/controller/main.ts"></script>
</body>
</html>
