<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="TBRN-Games — Phone Controller">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#07050F">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/fonts/fonts.css">
  <link rel="stylesheet" href="/client/kit/kit.css">
  <title>TBRN-Games Controller</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: var(--body);
      background: var(--ink);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      overflow: hidden;
      position: relative;
      padding:
        env(safe-area-inset-top, 0)
        env(safe-area-inset-right, 0)
        env(safe-area-inset-bottom, 0)
        env(safe-area-inset-left, 0);
    }
    .appbar {
      flex: 0 0 auto;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 1px solid var(--border);
      position: relative;
      z-index: 1;
    }
    .brand {
      font-family: var(--title);
      font-size: 11px;
      letter-spacing: 0.18em;
      display: flex;
      gap: 6px;
      align-items: baseline;
    }
    .brand b { color: var(--magenta); font-weight: 700; }
    .who {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      color: var(--muted);
      max-width: 55vw;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--muted);
      flex: 0 0 auto;
    }
    .dot.on {
      background: var(--success);
          }
    .dot.off {
      background: var(--danger);
          }
    main {
      flex: 1;
      min-height: 0;
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    /* ---- Join ---- */
    .join {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 14px;
      width: 100%;
      max-width: 380px;
      margin: 0 auto;
      padding: 20px 20px 28px;
      border-left: 3px solid var(--magenta);
    }
    .kick {
      font-size: 12px;
      color: var(--muted);
    }
    .code-field { display: flex; flex-direction: column; gap: 6px; }
    .code-field label,
    .name-field span {
      font-size: 11px;
      color: var(--muted);
    }
    .code-input,
    .name-field input {
      width: 100%;
      height: 58px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-family: var(--body);
      font-size: 16px;
      padding: 0 14px;
      outline: none;
    }
    .code-input {
      font-family: var(--title);
      font-size: 28px;
      letter-spacing: 0.28em;
      text-align: center;
      text-transform: uppercase;
      padding-left: calc(14px + 0.28em);
    }
    .code-input::placeholder {
      color: rgba(162,155,207,0.35);
      letter-spacing: 0.18em;
    }
    .code-input:focus,
    .name-field input:focus {
      border-color: var(--cyan);
          }
    .name-field { display: flex; flex-direction: column; gap: 6px; }
    .linked {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 44px;
      padding: 0 12px;
      border-radius: 10px;
      background: rgba(61,255,162,0.08);
      border: 1px solid rgba(61,255,162,0.28);
      color: var(--success);
      font-size: 13px;
    }
    .primary {
      height: 56px;
      width: 100%;
      border: 0;
      border-radius: 10px;
      background: var(--magenta);
      color: var(--ink);
      font-family: var(--display);
      font-weight: 700;
      font-size: 17px;
      cursor: pointer;
      transition: transform 100ms ease, background 120ms ease;
    }
    .primary:active { transform: scale(0.985); background: #FF54A8; }
    .primary:disabled { background: rgba(255,255,255,0.08); color: rgba(245,243,255,0.35); }
    .hint {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.45;
    }
    .hint.error { color: var(--danger); }
    /* ---- Play ---- */
    .play {
      flex: 1;
      width: 100%;
      max-width: 460px;
      margin: 0 auto;
      padding: 12px 14px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 0;
      overflow: hidden;
    }
    .coach {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 9px;
      min-height: 44px;
      padding: 9px 12px;
      border-radius: 10px;
      background: rgba(27,21,69,0.72);
      border: 1px solid var(--border);
      font-size: 13px;
      color: var(--muted);
      line-height: 1.35;
    }
    .coach .dot { background: var(--muted); }
    .coach.your-turn {
      border-color: rgba(255,46,151,0.55);
      color: var(--text);
      background: rgba(255,46,151,0.10);
    }
    .coach.your-turn .dot {
      background: var(--magenta);
            animation: breathe 1.6s ease-in-out infinite;
    }
    .game-label {
      flex: 0 0 auto;
      font-family: var(--display);
      font-weight: 700;
      font-size: 20px;
      letter-spacing: -0.01em;
      min-height: 1px;
    }
    .idle {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 9px;
      text-align: center;
      padding: 18px;
      min-height: 0;
    }
    .idle-mark {
      width: 82px;
      height: 82px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.12);
      display: grid;
      place-items: center;
      position: relative;
      margin-bottom: 8px;
    }
    .idle-mark::before {
      content: "";
      position: absolute;
      inset: -9px;
      border-radius: 50%;
      border: 1px solid rgba(255,46,151,0.30);
      animation: breathe 2.8s ease-in-out infinite;
    }
    .idle-mark span {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--magenta);
          }
    .idle-title {
      font-family: var(--display);
      font-weight: 700;
      font-size: 20px;
    }
    .idle-copy {
      font-size: 13px;
      color: var(--muted);
      max-width: 260px;
      line-height: 1.45;
    }
    .session-card {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 11px;
      padding: 14px;
      border-radius: 14px;
      background: var(--ink-2);
      border: 1px solid var(--border);
      text-align: left;
    }
    .session-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
    }
    .session-kicker {
      font-family: var(--display);
      font-weight: 700;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--magenta);
    }
    .session-round {
      font-family: var(--display);
      font-weight: 700;
      font-size: 12px;
      color: var(--muted);
    }
    .session-points {
      display: flex;
      align-items: baseline;
      gap: 7px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .session-points strong {
      font-family: var(--display);
      font-size: 28px;
      line-height: 1;
      color: var(--amber);
    }
    .session-points span { font-size: 11px; color: var(--muted); }
    .session-copy {
      font-size: 12px;
      line-height: 1.45;
      color: var(--muted);
    }
    .vote-list { display: flex; flex-direction: column; gap: 6px; }
    .vote-btn {
      min-height: 48px;
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.04);
      color: var(--text);
      font: inherit;
      text-align: left;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .vote-btn:disabled { cursor: default; opacity: 0.72; }
    .vote-btn.leading { border-color: rgba(255,46,151,0.58); background: rgba(255,46,151,0.13); }
    .vote-btn.yours { border-color: rgba(0,229,255,0.65); background: rgba(0,229,255,0.10); }
    .vote-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
    .vote-name { font-family: var(--display); font-weight: 700; font-size: 14px; }
    .vote-count { font-family: var(--display); font-weight: 700; font-size: 12px; color: var(--muted); }
    .vote-btn.leading .vote-count { color: var(--magenta); }
    .vote-bar {
      height: 3px;
      border-radius: 2px;
      background: rgba(255,255,255,0.09);
      overflow: hidden;
    }
    .vote-bar i { display: block; height: 100%; background: var(--magenta); }
    .vote-btn.yours .vote-bar i { background: var(--cyan); }
    .session-champion {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 8px 0 14px;
      border-bottom: 1px solid var(--border);
      text-align: center;
    }
    .session-champion strong {
      font-family: var(--title);
      font-size: 30px;
      line-height: 1.1;
    }
    .session-champion .pts { font-family: var(--display); font-weight: 700; color: var(--amber); font-size: 13px; }
    .session-trophies { display: flex; flex-direction: column; gap: 6px; }
    .trophy-row {
      padding: 8px 10px;
      border-radius: 9px;
      background: rgba(255,255,255,0.04);
      border-left: 3px solid var(--magenta);
    }
    .trophy-row .t {
      display: block;
      font-family: var(--display);
      font-weight: 700;
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--magenta);
    }
    .trophy-row .p { font-family: var(--display); font-weight: 700; font-size: 15px; }
    .trophy-row .d { display: block; font-size: 11px; color: var(--muted); }
    #controllerContainer {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: safe center;
      gap: 14px;
      width: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 8px;
    }
    #controllerContainer:empty { display: none; }
    #controllerContainer[data-layout="text"],
    #controllerContainer[data-layout="choice"] {
      justify-content: flex-start;
      padding-top: 18px;
    }
    /* ---- One button ---- */
    .btn-one {
      width: min(64vw, 230px);
      aspect-ratio: 1;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.18);
      background:
        var(--magenta);
      color: var(--ink);
      font-family: var(--display);
      font-weight: 700;
      font-size: 26px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      transition: transform 90ms ease, box-shadow 90ms ease;
      user-select: none;
    }
    .btn-one:active {
      transform: scale(0.94);
    }
    .btn-one:disabled { opacity: 0.4; transform: none; box-shadow: none; }
    .btn-label { font-size: 24px; letter-spacing: 0.02em; }
    .btn-count {
      font-family: var(--display);
      font-size: 38px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    /* ---- Left / right ---- */
    .lr-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
    }
    .btn-lr {
      height: min(34vh, 190px);
      min-height: 110px;
      border-radius: 18px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-family: var(--display);
      font-weight: 700;
      font-size: 17px;
      letter-spacing: 0.02em;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
      transition: transform 80ms ease, background 120ms ease, border-color 120ms ease;
    }
    .btn-lr::before {
      font-size: 30px;
      line-height: 1;
    }
    .btn-lr.left::before { content: "◀"; color: var(--cyan); }
    .btn-lr.right::before { content: "▶"; color: var(--magenta); }
    .btn-lr:active { transform: scale(0.97); }
    .btn-lr.left:active { background: rgba(0,229,255,0.14); border-color: rgba(0,229,255,0.5); }
    .btn-lr.right:active { background: rgba(255,46,151,0.14); border-color: rgba(255,46,151,0.5); }
    /* ---- D-pad ---- */
    .dpad {
      display: grid;
      grid-template-areas: ". up ." "left . right" ". down .";
      gap: 10px;
      width: min(88vw, 340px);
    }
    .dpad-btn {
      aspect-ratio: 1;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-family: var(--display);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
      transition: background 100ms ease, border-color 100ms ease, transform 70ms ease;
    }
    .dpad-btn:active {
      background: rgba(255,46,151,0.16);
      border-color: rgba(255,46,151,0.55);
      transform: scale(0.96);
    }
    .dpad-btn .glyph { font-size: 24px; line-height: 1; }
    .dpad-btn .cap { font-size: 11px; color: var(--muted); font-family: var(--body); font-weight: 600; }
    .dpad-btn.up { grid-area: up; }
    .dpad-btn.down { grid-area: down; }
    .dpad-btn.left { grid-area: left; }
    .dpad-btn.right { grid-area: right; }
    /* ---- Text ---- */
    .text-input {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .text-input textarea {
      width: 100%;
      min-height: 132px;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-family: var(--body);
      font-size: 17px;
      line-height: 1.45;
      resize: none;
      outline: none;
    }
    .text-input textarea:focus {
      border-color: var(--cyan);
          }
    .text-input button { width: 100%; }
    .char-count {
      text-align: right;
      font-size: 11px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    /* ---- Choices ---- */
    .choices {
      display: flex;
      flex-direction: column;
      gap: 9px;
      width: 100%;
    }
    .choice-btn {
      min-height: 56px;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-family: var(--body);
      font-size: 16px;
      font-weight: 600;
      line-height: 1.35;
      text-align: left;
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
      transition: background 100ms ease, border-color 100ms ease, transform 70ms ease;
    }
    .choice-btn:active { transform: scale(0.99); }
    .choice-btn.selected {
      background: rgba(255,46,151,0.14);
      border-color: var(--magenta);
      color: var(--text);
    }
    .choice-btn:disabled { opacity: 0.42; cursor: not-allowed; }
    .choices-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(46px, 1fr));
      gap: 6px;
    }
    .choices-grid .choice-btn {
      min-height: 48px;
      padding: 0;
      text-align: center;
      font-family: var(--display);
      font-weight: 700;
      font-size: 18px;
    }
    /* ---- Poker action bar ---- */
    .table-info {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      width: 100%;
    }
    .table-info span {
      padding: 5px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,0.05);
      font-size: 12px;
      color: var(--muted);
    }
    .actions {
      display: flex;
      gap: 8px;
      width: 100%;
    }
    .action-btn {
      flex: 1;
      min-height: 54px;
      padding: 0 6px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-family: var(--display);
      font-weight: 700;
      font-size: 14px;
      white-space: nowrap;
      cursor: pointer;
      touch-action: manipulation;
    }
    .action-btn.raise {
      background: var(--magenta);
      color: var(--ink);
      border-color: transparent;
    }
    .action-btn.fold {
      color: var(--danger);
      border-color: rgba(255,77,109,0.4);
    }
    .action-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .action-hint {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      padding-bottom: 4px;
    }
    /* ---- Grids ---- */
    .grid-frame {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 10px;
      border-radius: 14px;
      background: rgba(27,21,69,0.55);
      border: 1px solid var(--border);
    }
    .grid-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      color: var(--muted);
      padding: 0 2px;
    }
    .grid-wrap { width: 100%; overflow-x: auto; }
    .grid {
      display: grid;
      gap: 3px;
      width: 100%;
    }
    .grid-cell {
      aspect-ratio: 1;
      min-width: 0;
      border-radius: 4px;
      border: 1px solid rgba(255,255,255,0.07);
      background: rgba(255,255,255,0.025);
      color: var(--text);
      font-family: var(--display);
      font-weight: 700;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
      padding: 0;
    }
    .grid-cell:active { background: rgba(255,46,151,0.22); }
    .grid-cell.v-fill { background: rgba(255,255,255,0.07); }
    .grid-cell.v-X { background: rgba(255,77,109,0.20); color: var(--danger); border-color: rgba(255,77,109,0.45); }
    .grid-cell.v-o { color: var(--muted); }
    .grid-cell.v-S { background: rgba(61,255,162,0.13); color: var(--success); }
    .grid-cell.v-selected { border-color: var(--magenta); background: rgba(255,46,151,0.18); }
    .grid-cell.v-picked {
      border-color: var(--cyan);
      background: rgba(0,229,255,0.20);
          }
    .grid-actions {
      position: sticky;
      bottom: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
      padding: 8px;
      border-radius: 12px;
      background: rgba(11,8,32,0.95);
      border: 1px solid var(--border);
          }
    .grid-actions .pick {
      flex: 1;
      font-family: var(--display);
      font-weight: 700;
      font-size: 16px;
      color: var(--muted);
    }
    .grid-actions .pick.ready { color: var(--text); }
    .grid-actions .primary {
      flex: 0 0 auto;
      width: auto;
      min-width: 120px;
      height: 46px;
      padding: 0 18px;
      font-size: 15px;
    }
    .grid-divider {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 10px;
      padding: 4px 0 2px;
    }
    .grid-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    /* ---- Cards ---- */
    .hand {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      width: 100%;
      padding: 8px 0;
    }
    .card {
      width: 84px;
      height: 118px;
      border-radius: 10px;
      background: #F5F3FF;
      color: #1B1545;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      font-family: var(--display);
            cursor: pointer;
      user-select: none;
      touch-action: manipulation;
      transition: transform 90ms ease;
    }
    .card:active { transform: translateY(-8px); }
    .card.red { color: #D6204E; }
    .card.face-down {
      background:
        repeating-var(--ink-2);
      color: rgba(245,243,255,0.85);
      font-size: 24px;
    }
    .rank { font-size: 26px; font-weight: 700; line-height: 1; }
    .suit { font-size: 30px; line-height: 1; }
    .hidden { display: none !important; }
    @keyframes breathe {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    @media (max-height: 560px) {
      .btn-one { width: min(44vw, 160px); }
      .btn-lr { height: 30vh; min-height: 90px; }
      .dpad { width: min(70vw, 260px); }
      .text-input textarea { min-height: 96px; }
      .join { gap: 10px; }
      .code-input, .name-field input { height: 50px; }
      .primary { height: 50px; }
      .play { gap: 8px; }
      .game-label { font-size: 17px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .coach.your-turn .dot { animation: none; }
      .idle-mark::before { animation: none; }
      .primary, .btn-one, .btn-lr, .choice-btn, .card, .dpad-btn { transition: none; }
    }
  </style>
  <style>
    /* Paper-and-ink controller shell. Overrides the old synthwave layer. */
    :root {
      --ink: #1D1B26;
      --bg: #F4EBD9;
      --surface: #F4EBD9;
      --surface-hi: #E7E0CC;
      --border: #1D1B26;
      --text: #1D1B26;
      --muted: #5B5448;
      --magenta: #F0453A;
      --cyan: #0E8C8C;
      --amber: #FFC21A;
      --success: #2FB56A;
      --danger: #F0453A;
      --display: "Bricolage Grotesque", "Arial Black", sans-serif;
      --body: "Atkinson Hyperlegible", "Trebuchet MS", sans-serif;
      --title: "Bricolage Grotesque", "Arial Black", sans-serif;
    }
    body {
      background-color: #3A2418;
      background-image: var(--wood);
      background-size: 512px 512px;
      color: var(--ink);
    }
    .appbar {
      height: 58px;
      background: var(--paper);
      background-image: var(--paper-texture);
      background-size: 512px 512px;
      border-bottom: 3px solid var(--ink);
      color: var(--ink);
      padding: 0 14px;
    }
    .brand { font-family: var(--display); font-size: 19px; font-weight: 800; letter-spacing: -.02em; }
    .brand b { color: var(--ink-1); }
    .who { color: var(--ink); font-size: 14px; font-weight: 700; max-width: 72vw; }
    .head-token { width: 34px; height: 40px; display: none; flex: 0 0 auto; }
    .head-token.on { display: block; }
    .head-token .token-svg { width: 100%; height: 100%; }
    .dot { box-shadow: none; }
    .dot.on { background: var(--success); }
    .dot.off { background: var(--muted); }
    main { padding: 0; }
    .join {
      position: relative;
      margin: 18px auto 0;
      padding: 20px 18px;
      background: var(--paper);
      background-image: var(--paper-texture);
      background-size: 512px 512px;
      border: 3px solid var(--ink);
      border-radius: 7px 10px 6px 9px;
      box-shadow: 7px 7px 0 rgba(29,27,38,.55);
      rotate: -.5deg;
    }
    .join::before {
      content: "";
      position: absolute;
      top: -13px;
      left: 50%;
      width: 120px;
      height: 30px;
      transform: translateX(-50%) rotate(-3deg);
      background: url("/assets/props/tape.svg") center/contain no-repeat;
      pointer-events: none;
    }
    .join::after {
      content: "";
      position: absolute;
      top: -9px;
      right: 18px;
      width: 26px;
      height: 62px;
      transform: rotate(9deg);
      background: url("/assets/props/paperclip.svg") center/contain no-repeat;
      pointer-events: none;
      opacity: .8;
    }
    .kick {
      display: inline-block;
      padding-bottom: 7px;
      background: url("/assets/props/scribble.svg") bottom left / 100% 7px no-repeat;
    }
    .kick { font-family: var(--display); font-size: 24px; font-weight: 800; color: var(--ink); }
    .code-field label, .name-field span { color: var(--muted); font-size: 14px; font-weight: 700; }
    .code-input, .name-field input {
      background: #FFFDF5;
      color: var(--ink);
      border: 3px solid var(--ink);
      box-shadow: 3px 3px 0 var(--ink);
      border-radius: 5px 7px 4px 6px;
    }
    .code-input { font-family: var(--display); font-size: 30px; height: 58px; }
    .name-field input { font-family: var(--body); font-size: 18px; height: 54px; }
    .linked { background: #D9F0E8; border: 2px solid var(--ink); color: var(--ink-2); border-radius: 5px; }
    .primary {
      background: var(--ink-1);
      color: #FFF7E8;
      border: 3px solid var(--ink);
      border-radius: 6px 8px 5px 7px;
      box-shadow: 4px 4px 0 var(--ink);
      font-family: var(--display);
      font-size: 20px;
      font-weight: 800;
      height: 58px;
    }
    .primary:active { transform: translate(3px,3px); box-shadow: 1px 1px 0 var(--ink); background: var(--ink-1); }
    .primary:disabled { background: #D8CCB8; color: #8A7A66; box-shadow: 2px 2px 0 var(--ink); }
    .hint { color: var(--muted); font-size: 14px; }
    .play {
      position: relative;
      gap: 10px;
      padding: 14px 14px 18px;
      margin: 10px auto 0;
      max-width: 440px;
      background: var(--paper);
      background-image: var(--paper-texture);
      background-size: 512px 512px;
      border: 3px solid var(--ink);
      border-radius: 6px 9px 5px 8px;
      box-shadow: 6px 6px 0 rgba(29,27,38,.5);
      rotate: -.35deg;
    }
    .play::before {
      content: "";
      position: absolute;
      top: -12px;
      right: 30px;
      width: 96px;
      height: 25px;
      transform: rotate(4deg);
      background: url("/assets/props/tape.svg") center/contain no-repeat;
      pointer-events: none;
    }
    .play::after {
      content: "";
      position: absolute;
      top: -8px;
      left: 18px;
      width: 22px;
      height: 22px;
      transform: rotate(-8deg);
      background: url("/assets/props/star.svg") center/contain no-repeat;
      pointer-events: none;
    }
    .game-label {
      display: inline-block;
      padding-bottom: 6px;
      font-family: var(--display);
      font-size: 26px;
      color: var(--ink);
      background: url("/assets/props/scribble.svg") bottom left / 100% 7px no-repeat;
    }
    .coach {
      background: var(--paper);
      background-image: var(--paper-texture);
      background-size: 512px 512px;
      border: 2px solid var(--ink);
      box-shadow: 3px 3px 0 var(--ink);
      color: var(--ink);
      font-size: 15px;
      border-radius: 5px 8px 4px 7px;
    }
    .coach .dot { background: var(--muted); }
    .coach.your-turn { background: var(--amber); border-color: var(--ink); color: var(--ink); }
    .coach.your-turn .dot { background: var(--ink-1); box-shadow: none; animation: none; }
    .idle {
      background: var(--paper);
      background-image: var(--paper-texture);
      background-size: 512px 512px;
      border: 3px solid var(--ink);
      box-shadow: 5px 5px 0 var(--ink);
      rotate: -.7deg;
    }
    .idle-mark { border: 3px dashed var(--ink); }
    .idle-mark::before { display: none; }
    .idle-mark span { background: var(--ink-1); box-shadow: none; }
    .idle-title { font-family: var(--display); font-size: 24px; }
    .idle-copy { color: var(--muted); font-size: 15px; }
    .btn-one {
      background: var(--ink-1);
      border: 4px solid var(--ink);
      box-shadow: 8px 8px 0 var(--ink);
      color: #FFF7E8;
      font-family: var(--display);
      font-size: 28px;
    }
    .btn-one:active { transform: translate(4px,4px) scale(.98); box-shadow: 2px 2px 0 var(--ink); }
    .btn-one:disabled { opacity: .5; box-shadow: 4px 4px 0 var(--ink); }
    .btn-lr {
      background: var(--paper);
      border: 3px solid var(--ink);
      box-shadow: 5px 5px 0 var(--ink);
      color: var(--ink);
      font-family: var(--display);
    }
    .btn-lr.left::before { color: var(--ink-2); }
    .btn-lr.right::before { color: var(--ink-1); }
    .btn-lr:active { transform: translate(3px,3px); box-shadow: 1px 1px 0 var(--ink); background: var(--amber); }
    .dpad-btn {
      background: var(--paper);
      border: 3px solid var(--ink);
      box-shadow: 4px 4px 0 var(--ink);
      color: var(--ink);
    }
    .dpad-btn:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 var(--ink); background: var(--amber); border-color: var(--ink); }
    .dpad-btn .glyph { color: var(--ink); }
    .dpad-btn .cap { color: var(--muted); }
    .text-input textarea {
      background: #FFFDF5;
      color: var(--ink);
      border: 3px solid var(--ink);
      box-shadow: 3px 3px 0 var(--ink);
      border-radius: 5px 7px 4px 6px;
      font-family: var(--body);
    }
    .choice-btn {
      background: var(--paper);
      border: 3px solid var(--ink);
      box-shadow: 3px 3px 0 var(--ink);
      color: var(--ink);
      border-radius: 5px 7px 4px 6px;
      font-family: var(--body);
      font-size: 18px;
    }
    .choice-btn:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 var(--ink); }
    .choice-btn.selected { background: var(--amber); border-color: var(--ink); color: var(--ink); }
    .choice-btn:disabled { opacity: .5; }
    .card {
      background: #FFFDF5;
      color: var(--ink);
      border: 3px solid var(--ink);
      box-shadow: 4px 4px 0 var(--ink);
    }
    .card.red { color: var(--ink-1); }
    .card.face-down { background: var(--ink-2); color: #FFF7E8; }
    .session-card {
      background: var(--paper);
      background-image: var(--paper-texture);
      background-size: 512px 512px;
      border: 3px solid var(--ink);
      box-shadow: 5px 5px 0 var(--ink);
      color: var(--ink);
      border-radius: 6px 9px 5px 8px;
    }
    .session-kicker { color: var(--ink-1); font-family: var(--display); }
    .session-round { color: var(--muted); }
    .session-points { border-bottom: 2px dashed rgba(29,27,38,.28); }
    .session-points strong { font-family: var(--display); color: var(--ink-1); }
    .session-points span, .session-copy { color: var(--muted); font-size: 14px; }
    .vote-btn {
      background: #FFFDF5;
      border: 2px solid var(--ink);
      box-shadow: 2px 2px 0 var(--ink);
      color: var(--ink);
    }
    .vote-btn.leading { background: var(--amber); border-color: var(--ink); }
    .vote-btn.yours { background: #D9F0E8; border-color: var(--ink-2); }
    .vote-name { font-size: 16px; }
    .vote-count { font-size: 13px; color: var(--muted); }
    .vote-bar { background: rgba(29,27,38,.18); }
    .vote-bar i { background: var(--ink-1); }
    .vote-btn.yours .vote-bar i { background: var(--ink-2); }
    .trophy-row {
      background: #FFFDF5;
      border-left: 5px solid var(--ink-1);
      border-radius: 4px;
    }
    .trophy-row .t { color: var(--ink-1); }
    .trophy-row .p { color: var(--ink); }
    .trophy-row .d { color: var(--muted); }
    .grid-frame {
      background: var(--paper);
      background-image: var(--paper-texture);
      background-size: 512px 512px;
      border: 3px solid var(--ink);
      box-shadow: 4px 4px 0 var(--ink);
      border-radius: 5px 8px 4px 7px;
    }
    .grid-label { font-size: 12px; color: var(--muted); }
    .grid-cell {
      background: #FFFDF5;
      border: 1px solid var(--ink);
      color: var(--ink);
      border-radius: 2px;
    }
    .grid-cell.v-fill { background: #D8CCB8; }
    .grid-cell.v-X { background: var(--ink-1); color: #FFF7E8; border-color: var(--ink); }
    .grid-cell.v-o { color: var(--muted); }
    .grid-cell.v-S { background: #D9F0E8; color: var(--ink-2); }
    .grid-cell.v-selected { background: var(--amber); border-color: var(--ink); }
    .grid-cell.v-picked { background: #D9F0E8; border-color: var(--ink-2); box-shadow: 2px 2px 0 var(--ink); }
    .grid-actions {
      background: var(--paper);
      border: 3px solid var(--ink);
      box-shadow: 3px 3px 0 var(--ink);
      backdrop-filter: none;
    }
    .grid-actions .pick { color: var(--muted); }
    .grid-actions .pick.ready { color: var(--ink); }
    .error-toast { background: var(--ink-1) !important; color: #FFF7E8 !important; border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); }
  </style>
</head>
<body>
  <header class="appbar">
    <div class="brand"><span>TBRN</span><b>GAMES</b></div>
    <div class="who"><span class="head-token" id="playerToken"></span><span class="dot" id="connDot"></span><span id="playerName">Not joined</span></div>
  </header>
  <main>
    <section class="join" id="joinForm">
      <p class="kick">Join the room</p>
      <div class="code-field" id="codeField">
        <label for="codeInput">Room code</label>
        <input class="code-input" id="codeInput" placeholder="ABC12" maxlength="5" autocomplete="off" autocapitalize="characters" spellcheck="false" inputmode="text">
      </div>
      <div class="linked hidden" id="roomLinked"><span class="dot on"></span>Room linked from the QR code</div>
      <label class="name-field">
        <span>Your name</span>
        <input id="nameInput" placeholder="Your name" maxlength="20" autocomplete="off" autocapitalize="words">
      </label>
      <button class="primary" id="joinBtn">Join room</button>
      <p class="hint" id="joinError" role="alert"></p>
      <p class="hint" id="joinHint">The code is on the laptop screen.</p>
    </section>

    <section class="play hidden" id="controllerArea">
      <div class="game-label" id="gameLabel"></div>
      <div class="coach" id="coach"><span class="dot"></span><span id="status">Waiting for the host…</span></div>
      <section class="session-card hidden" id="sessionCard" aria-live="polite"></section>
      <div class="idle" id="idle">
        <div class="idle-mark"><span></span></div>
        <p class="idle-title">You're at the table</p>
        <p class="idle-copy">Keep this tab open. The host picks a game on the laptop.</p>
      </div>
      <div id="controllerContainer"></div>
    </section>
  </main>
  <script type="module" src="/controller/main.ts"></script>
</body>
</html>
