<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="TBRN-Games — Controller">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>TBRN-Games Controller</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-bg: #0F172A;
      --color-surface: #1E293B;
      --color-primary: #2E7DFF;
      --color-text: #F8FAFC;
      --color-text-muted: #94A3B8;
      --font-sans: "Inter", system-ui, sans-serif;
      --spacing-4: 1rem;
      --spacing-6: 1.5rem;
      --radius-lg: 0.5rem;
      --radius-full: 9999px;
      --spacing-3: 0.75rem;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-bg);
      color: var(--color-text);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    header {
      padding: var(--spacing-4);
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h1 { font-size: 1.125rem; font-weight: 600; }
    .player-name { color: var(--color-text-muted); font-size: 0.875rem; }
    main { flex: 1; display: flex; flex-direction: column; padding: var(--spacing-4); }
    .join-form { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: var(--spacing-4); max-width: 400px; margin: 0 auto; width: 100%; }
    .join-form input {
      padding: 1rem; font-size: 1.125rem; border: 2px solid #334155; border-radius: var(--radius-lg);
      background: var(--color-surface); color: var(--color-text); width: 100%;
    }
    .join-form input:focus { outline: none; border-color: var(--color-primary); }
    .join-form button {
      padding: 1rem; font-size: 1.125rem; font-weight: 600; background: var(--color-primary);
      color: white; border: none; border-radius: var(--radius-lg); cursor: pointer;
    }
    .controller { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: var(--spacing-6); }
    .controller.hidden { display: none; }

    /* Dynamic controller container */
    #controllerContainer { width: 100%; max-width: 400px; display: flex; flex-direction: column; align-items: center; gap: var(--spacing-4); }

    /* One-button controller */
    .btn-one { width: 200px; height: 200px; border-radius: var(--radius-full); background: var(--color-primary); border: none; color: white; font-size: 2rem; font-weight: 700; cursor: pointer; touch-action: manipulation; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 0 40px rgb(46 125 255 / 0.4); transition: transform 0.1s, box-shadow 0.1s; }
    .btn-one:active { transform: scale(0.95); box-shadow: 0 0 60px rgb(46 125 255 / 0.6); }
    .btn-one:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: 0 0 40px rgb(46 125 255 / 0.4); }
    .btn-label { font-size: 1.5rem; }
    .btn-count { font-size: 3rem; font-weight: 700; font-family: "JetBrains Mono", monospace; }

    /* Left-Right controller */
    .lr-row { display: flex; gap: var(--spacing-4); width: 100%; justify-content: center; }
    .btn-lr { width: 140px; height: 140px; border-radius: var(--radius-lg); background: var(--color-surface); border: 2px solid #334155; color: var(--color-text); font-size: 1.5rem; font-weight: 600; cursor: pointer; touch-action: manipulation; display: flex; align-items: center; justify-content: center; }
    .btn-lr:active { background: var(--color-primary); border-color: var(--color-primary); }
    .btn-lr.left:active { background: #1A66E0; }
    .btn-lr.right:active { background: #E05528; }

    /* D-Pad */
    .dpad { display: grid; grid-template-areas: ". up ." "left . right" ". down ."; gap: 8px; }
    .dpad-btn { width: 80px; height: 80px; border-radius: var(--radius-lg); background: var(--color-surface); border: 2px solid #334155; color: var(--color-text); font-size: 1.5rem; cursor: pointer; touch-action: manipulation; display: flex; align-items: center; justify-content: center; }
    .dpad-btn:active { background: var(--color-primary); border-color: var(--color-primary); }
    .dpad-btn.up { grid-area: up; }
    .dpad-btn.down { grid-area: down; }
    .dpad-btn.left { grid-area: left; }
    .dpad-btn.right { grid-area: right; }

    /* Text input */
    .text-input { width: 100%; max-width: 400px; }
    .text-input textarea { width: 100%; min-height: 120px; padding: 1rem; font-size: 1.125rem; font-family: var(--font-sans); border: 2px solid #334155; border-radius: var(--radius-lg); background: var(--color-surface); color: var(--color-text); resize: none; }
    .text-input textarea:focus { outline: none; border-color: var(--color-primary); }
    .text-input button { margin-top: var(--spacing-4); width: 100%; }
    .char-count { text-align: right; font-size: 0.75rem; color: var(--color-text-muted); margin-top: 0.25rem; }

    /* Choice/Vote */
    .choices { display: flex; flex-direction: column; gap: var(--spacing-3); width: 100%; max-width: 400px; }
    .choice-btn { padding: 1rem; font-size: 1.125rem; font-weight: 500; background: var(--color-surface); border: 2px solid #334155; border-radius: var(--radius-lg); color: var(--color-text); cursor: pointer; touch-action: manipulation; text-align: left; }
    .choice-btn:active, .choice-btn.selected { background: var(--color-primary); border-color: var(--color-primary); }

    /* Private Grid (Guess Who / Sea Battle) */
    .grid { display: grid; gap: 4px; max-width: 400px; }
    .grid-cell { aspect-ratio: 1; background: var(--color-surface); border: 1px solid #334155; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; cursor: pointer; touch-action: manipulation; }
    .grid-cell:active { background: var(--color-primary); }

    /* Card Hand */
    .hand { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; padding: var(--spacing-4); }
    .card { width: 80px; height: 112px; border-radius: 8px; background: white; color: #0F172A; box-shadow: 0 4px 12px rgb(0 0 0 / 0.3); display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 600; cursor: pointer; touch-action: manipulation; transition: transform 0.1s; }
    .card:active { transform: translateY(-8px); }
    .card.red { color: #EF4444; }
    .card.face-down { background: var(--color-primary); color: white; }
    .rank { font-size: 1.5rem; }
    .suit { font-size: 2rem; }

    .status { text-align: center; color: var(--color-text-muted); font-size: 0.875rem; padding: var(--spacing-4); }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <header>
    <h1>TBRN-Games</h1>
    <span class="player-name" id="playerName">Not joined</span>
  </header>
  <main>
    <!-- Join Form -->
    <section class="join-form" id="joinForm">
      <input type="text" id="nameInput" placeholder="Your name" autocomplete="off" maxlength="20">
      <button id="joinBtn">Join</button>
    </section>

    <!-- Controller Area (shown after join) -->
    <section class="controller hidden" id="controllerArea">
      <div class="status" id="status">Waiting for host to start...</div>
      <div id="controllerContainer"></div>
    </section>
  </main>
  <script type="module" src="/controller/main.ts"></script>
</body>
</html>
