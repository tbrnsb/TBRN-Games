<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TBRN-Games — Laptop</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #11131a;
        color: #f2f4f8;
      }

      main {
        width: min(52rem, 92vw);
        padding: 2rem;
        border: 1px solid #2c3040;
        border-radius: 1rem;
        background: #191c26;
      }

      h1 {
        margin-top: 0;
      }

      h2 {
        font-size: 1rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #9aa3b8;
      }

      .status {
        font-size: 1.125rem;
        color: #9fe0a8;
      }

      .status[data-state="error"] {
        color: #ff9a9a;
      }

      .muted {
        color: #9aa3b8;
      }

      ol {
        margin: 0;
        padding-left: 1.25rem;
        font-size: 1.25rem;
        line-height: 1.7;
      }

      .empty {
        color: #9aa3b8;
      }

      .away {
        color: #9aa3b8;
        font-size: 0.9em;
      }

      .round {
        margin: 0;
        color: #9aa3b8;
        font-size: 0.95rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .prompt {
        margin: 0.5rem 0 1.25rem;
        font-size: clamp(1.5rem, 3vw, 2.25rem);
        line-height: 1.25;
      }

      .options {
        display: grid;
        gap: 0.75rem;
        grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr));
      }

      .option {
        display: flex;
        gap: 0.75rem;
        align-items: center;
        padding: 1rem;
        border: 1px solid #343a4e;
        border-radius: 0.75rem;
        background: #11131a;
        font-size: 1.2rem;
      }

      .tag {
        display: grid;
        place-items: center;
        width: 2rem;
        height: 2rem;
        flex: none;
        border-radius: 999px;
        background: #6f9dff;
        color: #10131c;
        font-weight: 700;
      }

      .counts {
        margin: 1.25rem 0 0;
        font-size: 1.35rem;
      }

      .winner {
        font-size: 1.35rem;
        color: #9fe0a8;
      }

      .winner[data-result="none"] {
        color: #ffd28a;
      }

      .timer {
        color: #ffd28a;
        font-size: 1.05rem;
      }

      .scores {
        font-size: 1.25rem;
      }

      a {
        color: #9cc4ff;
      }

      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body data-page="laptop">
    <main>
      <h1>TBRN-Games</h1>
      <p class="status" id="status" data-state="pending">Contacting the server…</p>

      <section id="lobby">
        <p>This laptop is running the game server and shared screen.</p>

        <h2>Lobby</h2>
        <p id="count">0 / 4 players</p>
        <p class="muted" id="host">Waiting for a host.</p>
        <ol id="players" aria-live="polite"></ol>
        <p class="empty" id="empty">Waiting for phones to join.</p>
        <p class="muted" id="available-games"></p>

        <p>
          Open <a href="/play">/play</a> on a phone connected to the same Wi-Fi.
        </p>
      </section>

      <section id="game" hidden>
        <p class="round" id="game-round"></p>
        <p class="prompt" id="game-prompt"></p>

        <div class="options">
          <div class="option"><span class="tag">A</span><span id="option-a"></span></div>
          <div class="option"><span class="tag">B</span><span id="option-b"></span></div>
        </div>

        <p class="muted" id="vote-count"></p>
        <p class="timer" id="vote-timer"></p>

        <p class="counts" id="game-counts" hidden></p>
        <p class="winner" id="game-winner" hidden></p>

        <h2 id="scores-heading" hidden>Scores</h2>
        <ol class="scores" id="game-scores" hidden></ol>

        <p class="muted" id="game-status"></p>
      </section>
    </main>
    <script>
      const status = document.getElementById("status");
      const lobby = document.getElementById("lobby");
      const count = document.getElementById("count");
      const host = document.getElementById("host");
      const players = document.getElementById("players");
      const empty = document.getElementById("empty");
      const availableGames = document.getElementById("available-games");
      const gameSection = document.getElementById("game");
      const gameRound = document.getElementById("game-round");
      const gamePrompt = document.getElementById("game-prompt");
      const optionA = document.getElementById("option-a");
      const optionB = document.getElementById("option-b");
      const voteCount = document.getElementById("vote-count");
      const voteTimer = document.getElementById("vote-timer");
      const gameCounts = document.getElementById("game-counts");
      const gameWinner = document.getElementById("game-winner");
      const scoresHeading = document.getElementById("scores-heading");
      const gameScores = document.getElementById("game-scores");
      const gameStatus = document.getElementById("game-status");
      const socketUrl =
        (location.protocol === "https:" ? "wss:" : "ws:") +
        "//" +
        location.host +
        "/ws";

      let socket;
      let countdownTimer;

      function setStatus(text, state) {
        status.textContent = text;
        status.dataset.state = state;
      }

      function clearCountdown() {
        if (countdownTimer !== undefined) {
          clearInterval(countdownTimer);
          countdownTimer = undefined;
        }
      }

      function renderLobby(state) {
        clearCountdown();
        lobby.hidden = false;
        gameSection.hidden = true;
        count.textContent =
          state.players.length + " / " + state.maxPlayers + " players";

        const hostPlayer = state.players.find(
          (player) => player.id === state.hostId,
        );
        host.textContent = hostPlayer
          ? "Host: " + hostPlayer.name
          : "Waiting for a host.";

        availableGames.textContent =
          state.games.length > 0
            ? "Games: " + state.games.map((game) => game.name).join(", ")
            : "No games are registered yet.";

        players.replaceChildren();
        empty.hidden = state.players.length > 0;

        for (const player of state.players) {
          const item = document.createElement("li");
          item.textContent = player.name;
          if (!player.connected) {
            const away = document.createElement("span");
            away.className = "away";
            away.textContent = " (reconnecting)";
            item.append(away);
          }
          players.append(item);
        }
      }

      function renderScores(scores) {
        gameScores.replaceChildren();

        for (const score of scores) {
          const item = document.createElement("li");
          item.textContent = score.name + " — " + score.score;
          gameScores.append(item);
        }
      }

      function startCountdown(deadline) {
        clearCountdown();

        function tick() {
          const seconds = Math.max(
            0,
            Math.ceil((deadline - Date.now()) / 1000),
          );

          if (seconds === 0) {
            voteTimer.textContent = "Time is up.";
            clearCountdown();
            return;
          }

          voteTimer.textContent = "Voting closes in " + seconds + "s";
        }

        voteTimer.hidden = false;
        tick();
        countdownTimer = setInterval(tick, 250);
      }

      function renderScreen(state) {
        const view = state.view;
        lobby.hidden = true;
        gameSection.hidden = false;
        gameRound.textContent =
          "Round " + view.round + " of " + view.totalRounds;
        gamePrompt.textContent = view.prompt.text;
        optionA.textContent = view.prompt.a;
        optionB.textContent = view.prompt.b;

        if (view.phase === "voting") {
          clearCountdown();
          voteCount.hidden = false;
          voteCount.textContent =
            view.votedCount + " / " + view.playerCount + " players voted";
          startCountdown(view.deadline);
          gameCounts.hidden = true;
          gameWinner.hidden = true;
          scoresHeading.hidden = true;
          gameScores.hidden = true;
          gameStatus.textContent = "Pick A or B on your phone.";
          return;
        }

        clearCountdown();
        voteCount.hidden = true;
        voteTimer.hidden = true;
        gameCounts.hidden = false;
        gameCounts.textContent = "A: " + view.counts.a + " · B: " + view.counts.b;

        const cast = view.counts.a + view.counts.b;
        gameWinner.hidden = false;

        if (view.winner === null) {
          gameWinner.dataset.result = "none";
          gameWinner.textContent =
            cast < 2
              ? "Fewer than two votes — no points."
              : "A tie — no points.";
        } else {
          delete gameWinner.dataset.result;
          gameWinner.textContent =
            "Side " + view.winner.toUpperCase() + " takes the round.";
        }

        scoresHeading.hidden = false;
        gameScores.hidden = false;
        renderScores(view.scores);

        if (view.phase === "finished") {
          gameStatus.textContent =
            view.winners.length === 1
              ? view.winners[0].name + " wins Same Wave."
              : "Shared win: " +
                view.winners.map((winner) => winner.name).join(", ") +
                ".";
          return;
        }

        gameStatus.textContent =
          "Waiting for the host to start the next round.";
      }

      function connect() {
        setStatus("Contacting the server…", "pending");
        socket = new WebSocket(socketUrl);

        socket.addEventListener("open", () => {
          setStatus("Connected to the game server.", "ok");
        });

        socket.addEventListener("message", (event) => {
          let message;

          try {
            message = JSON.parse(event.data);
          } catch {
            return;
          }

          if (message.type === "lobby") {
            renderLobby(message.state);
          }

          if (message.type === "screen") {
            renderScreen(message.state);
          }

          if (message.type === "error") {
            setStatus(message.message, "error");
          }
        });

        socket.addEventListener("close", () => {
          clearCountdown();
          setStatus("Disconnected. Reconnecting…", "error");
          setTimeout(connect, 2000);
        });
      }

      connect();
    </script>
  </body>
</html>
